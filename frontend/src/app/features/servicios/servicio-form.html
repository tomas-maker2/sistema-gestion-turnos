<h2 mat-dialog-title>{{ esNuevo ? 'Nuevo servicio' : 'Editar servicio' }}</h2>

<form [formGroup]="form" (ngSubmit)="guardar()">
  <mat-dialog-content class="formulario-dialogo">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" autocomplete="off" maxlength="100" />
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>Ingresá el nombre del servicio</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Duración (minutos)</mat-label>
      <input matInput type="number" formControlName="duracionMinutos" min="5" max="480" step="5" />
      @if (form.controls.duracionMinutos.invalid) {
        <mat-error>Ingresá un número entero entre 5 y 480</mat-error>
      }
    </mat-form-field>

    @if (error()) {
      <p class="mensaje-error" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="guardando()">Guardar</button>
  </mat-dialog-actions>
</form>
