<main class="login">
  <mat-card>
    <img class="logo" src="logo.svg" alt="Gestión Turnos" />
    <p class="subtitulo">Iniciá sesión para continuar</p>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="enviar()">
        <mat-form-field>
          <mat-label>Usuario</mat-label>
          <input matInput formControlName="nombreUsuario" autocomplete="username" />
          @if (form.controls.nombreUsuario.hasError('required')) {
            <mat-error>Ingresá tu usuario</mat-error>
          }
        </mat-form-field>

        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          @if (form.controls.password.hasError('required')) {
            <mat-error>Ingresá tu contraseña</mat-error>
          }
        </mat-form-field>

        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="enviando()">Ingresar</button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
